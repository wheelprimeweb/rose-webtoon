name: ROSE 자동 최적화 및 배포
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rose-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: 이미지 도구 설치
        run: python -m pip install -r requirements.txt
      - name: 변경 없는 이미지의 변환 결과 재사용
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: rose-lossless-v3-${{ runner.os }}-${{ hashFiles('scripts/build.py', 'requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            rose-lossless-v3-${{ runner.os }}-${{ hashFiles('scripts/build.py', 'requirements.txt') }}-
      - name: 자동 등록·순서·복구 검사
        run: python -m unittest discover -s tests -v
      - name: 원본 검사·무손실 최적화·정적 페이지 생성
        run: python scripts/build.py
      - name: 생성된 회차 및 링크 검사
        run: python scripts/check_site.py
      - name: Pages 준비
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: 사이트 업로드
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 검증된 사이트 공개
        id: deployment
        uses: actions/deploy-pages@v4
